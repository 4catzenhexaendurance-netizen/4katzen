const translations={"de": [["Sauna", "01 / Wärme", "Ein Ritual aus Wärme und Ruhe.", "Nimm dir nach körperlicher Aktivität Zeit zum Abschalten. Wähle eine angenehme Temperatur und ruhe dich zwischen den Saunagängen aus.", ["Trinke Wasser und lege ein Handtuch bereit.", "Gehe in die Sauna und bleibe nur so lange, wie es angenehm ist.", "Kühle dich anschließend langsam ab, ruhe dich aus und trinke ausreichend."], "Vermeide die Sauna bei Flüssigkeitsmangel oder Unwohlsein. Verlasse sie sofort bei Schwindel oder Übelkeit."], ["Aromatherapie", "02 / Duft", "Düfte, Ruhe und Entspannung.", "Schaffe einen ruhigen Raum mit einem milden Duft deiner Wahl und einigen Minuten Ruhe. Aromatherapie dient dem Wohlbefinden und ist keine medizinische Behandlung.", ["Sorge für einen ruhigen, gut gelüfteten Raum.", "Befolge bei einem Diffusor die Herstelleranleitung.", "Setze oder lege dich bequem hin, atme natürlich und ruhe dich aus."], "Ätherische Öle nicht einnehmen oder unverdünnt auf die Haut auftragen. Bei Reizungen abbrechen."], ["Sportmassage", "03 / Berührung", "Zeit für müde Muskeln.", "Plane eine Sportmassage bei einer qualifizierten Fachkraft, mit Fokus auf die beim Training beanspruchten Bereiche.", ["Wähle die Dauer und informiere die Fachkraft über deine Aktivitäten.", "Vereinbare eine angenehme Intensität; die Massage sollte keine stechenden Schmerzen verursachen.", "Plane danach etwas Zeit für ruhige Erholung ein."], "Bei frischen Verletzungen, starken Schmerzen oder unerklärlichen Schwellungen zunächst fachlichen Rat einholen. Die Demo bucht keinen echten Termin."]], "it": [["Sauna", "01 / Calore", "Un rituale di calore e riposo.", "Rallenta dopo l’attività fisica. Scegli una temperatura confortevole e riposati tra una permanenza in sauna e l’altra.", ["Bevi acqua e prepara un asciugamano.", "Entra in sauna e resta solo finché ti senti a tuo agio.", "Una volta uscito, raffreddati gradualmente, riposa e reintegra i liquidi."], "Evita la sauna se sei disidratato o non ti senti bene. Esci subito in caso di vertigini o nausea."], ["Aromaterapia", "02 / Profumo", "Profumi, calma e relax.", "Crea uno spazio tranquillo con un profumo delicato a tua scelta e qualche minuto di riposo. L’aromaterapia è un rituale di benessere, non un trattamento medico.", ["Prepara uno spazio tranquillo e ben ventilato.", "Se usi un diffusore, segui le istruzioni del produttore.", "Siediti o sdraiati comodamente, respira naturalmente e riposa."], "Non ingerire gli oli essenziali né applicarli puri sulla pelle. Interrompi in caso di irritazione."], ["Massaggio sportivo", "03 / Contatto", "Tempo per i muscoli affaticati.", "Programma un massaggio sportivo con un professionista qualificato, concentrandoti sulle zone sollecitate dall’allenamento.", ["Scegli la durata e informa il professionista sulle attività svolte.", "Concorda un’intensità confortevole; il massaggio non deve provocare dolore acuto.", "Dopo il massaggio, dedica del tempo al riposo."], "In caso di lesioni recenti, dolore intenso o gonfiore inspiegabile, chiedi prima una valutazione professionale. La demo non prenota appuntamenti reali."]], "en": [["Sauna", "01 / Warmth", "A ritual of warmth and rest.", "Take time to slow down after activity. Choose a comfortable temperature and rest between sauna visits.", ["Drink water and prepare a towel.", "Enter the sauna and stay only as long as you feel comfortable.", "After leaving, cool down gradually, rest and replenish fluids."], "Avoid the sauna if dehydrated or unwell. Leave immediately if you feel dizzy or nauseated."], ["Aromatherapy", "02 / Scent", "Scents, calm and relaxation.", "Create a peaceful space with a gentle scent of your choice and a few minutes of rest. Aromatherapy is a wellness ritual, not a medical treatment.", ["Prepare a quiet, well-ventilated space.", "If using a diffuser, follow the manufacturer’s instructions.", "Sit or lie comfortably, breathe naturally and rest."], "Do not ingest essential oils or apply them undiluted to your skin. Stop if irritation occurs."], ["Sports massage", "03 / Touch", "Time for tired muscles.", "Plan a sports massage with a qualified therapist, focusing on the areas stressed by training.", ["Choose a duration and tell the therapist about your activities.", "Agree on a comfortable intensity; massage should not cause sharp pain.", "Set aside time to rest afterwards."], "For a recent injury, severe pain or unexplained swelling, seek professional assessment first. This demo does not book a real appointment."]]};

const $=id=>document.getElementById(id);
const safeGet=(key,fallback)=>{try{return localStorage.getItem(key)||fallback}catch{return fallback}};
const safeSet=(key,val)=>{try{localStorage.setItem(key,val);return true}catch{return false}};
let lang=(['hr','de','it','en'].includes(new URLSearchParams(location.search).get('lang'))?new URLSearchParams(location.search).get('lang'):'hr');if(!UI[lang])lang='hr';
let chosen=0,duration=10,left=600,initial=600,deadline=0,running=false,active=false,interval=null,view='home',exitTarget='home',lastResult=null;
let logs=[];try{const saved=JSON.parse(safeGet('zen-demo-v1','[]'));if(Array.isArray(saved))logs=saved.filter(l=>l&&Number.isFinite(l.seconds)&&l.seconds>=0).map(l=>({...l,program:Number.isInteger(l.program)&&l.program>=0&&l.program<3?l.program:data.findIndex(p=>p.name===l.name)}))}catch{}
const t=k=>UI[lang][k];
const locale=()=>({hr:'hr-HR',de:'de-DE',it:'it-IT',en:'en-GB'})[lang];
const program=i=>{let p=data[i];if(lang==='hr')return {...p,name:i===1?'Aromaterapija':p.name};let [name,tag,desc,body,steps,warn]=translations[lang][i];return {...p,name,tag,desc,body,steps,warn}};
const theme=p=>`--accent:${p.accent};--edge:${p.edge};--tint:${p.tint}`;
// SVG ids must be unique when the same artwork is rendered in multiple views.
const art=(p,scope)=>p.art.replace(/id="([a-z][a-zA-Z0-9]*)"/g,(_,id)=>`id="${scope}-${id}"`).replace(/url\(#([a-z][a-zA-Z0-9]*)\)/g,(_,id)=>`url(#${scope}-${id})`).replace('aria-label="Ilustracija programa"',`aria-label="${t('imageLabel')}"`);
const backButton=()=>`<button class="back" onclick="navigate('home')">‹ ${t('back')}</button>`;
function renderHome(){for(const k of ['heroEyebrow','heroText','chooseTitle','ritualCount','homeNote','historyTitle','historyIntro','countLabel','minutesLabel','logTitle','privacy','navHomeText','navHistoryText','exitTitle','exitText','exitConfirm','exitKeep'])$(k).textContent=t(k);$('heroTitle').innerHTML=`${t('heroTitle')} <em>Zen.</em>`;$('language').value=lang;$('language').setAttribute('aria-label',t('language'));document.documentElement.lang=lang;document.querySelector('.logo').alt=t('logoAlt');document.querySelector('.bottom').setAttribute('aria-label',t('navLabel'));$('programs').innerHTML=data.map((_,i)=>{const p=program(i);return `<button class="program" style="${theme(p)}" onclick="openProgram(${i})"><div class="art">${art(p,'home'+i)}</div><div class="copy"><div class="tag">${p.tag}</div><h3>${p.name}</h3><p>${p.desc}</p><div class="meta">${p.dur[0]}–${p.dur.at(-1)} min</div></div><div class="arrow" aria-hidden="true">›</div></button>`}).join('')}
function setLanguage(value){if(!UI[value])return;lang=value;safeSet('zen-language',lang);renderHome();if(view==='detail')renderDetail();if(view==='session')renderSession();if(view==='history')renderLogs();if(view==='complete')renderComplete()}
function show(id,historyMode='push'){view=id;document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!==id);$('navHome').classList.toggle('active',id!=='history');$('navHistory').classList.toggle('active',id==='history');$('navHome').setAttribute('aria-current',id==='home'?'page':'false');$('navHistory').setAttribute('aria-current',id==='history'?'page':'false');if(id==='history')renderLogs();try{if(historyMode==='push'&&history.state?.view!==id)history.pushState({view:id},'');else if(historyMode==='replace')history.replaceState({view:id},'')}catch{}window.scrollTo(0,0)}
function navigate(id){if(active&&id!=='session'){requestExit(id);return}show(id,id==='home'?'replace':'push')}
function openProgram(i){if(active)return;chosen=i;duration=data[i].def;renderDetail();show('detail')}
function renderDetail(){const p=program(chosen);$('detail').innerHTML=`${backButton()}<div class="detail" style="${theme(p)}"><div class="detail-art">${art(p,'detail')}</div><div class="detail-body"><div class="tag">${p.tag}</div><h1>${p.name}</h1><p>${p.body}</p><div class="small-title">${t('duration')}</div><div class="chips">${p.dur.map(n=>`<button class="chip ${duration===n?'selected':''}" aria-pressed="${duration===n}" onclick="selectDuration(${n})">${n} min</button>`).join('')}</div><div class="small-title">${t('ritual')}</div><ol class="steps">${p.steps.map(s=>`<li>${s}</li>`).join('')}</ol><p class="warning">${p.warn}</p><button class="primary" onclick="startSession()">${t('start')} · ${duration} min</button><button class="back" onclick="navigate('home')">‹ ${t('back')}</button></div></div>`}
function selectDuration(n){if(!data[chosen].dur.includes(n))return;duration=n;renderDetail()}
function startSession(){if(active)return;active=true;initial=duration*60;left=initial;running=true;deadline=Date.now()+left*1000;renderSession();show('session');clearInterval(interval);interval=setInterval(tick,250);tick()}
function renderSession(){const p=program(chosen);$('session').innerHTML=`<div class="session-top">${backButton()}</div><div class="session"><div class="session-art">${art(p,'session')}</div><div class="eyebrow">ZEN / ${t('activeSession')}</div><h1>${p.name}</h1><p>${t('sessionIntro')}</p><div class="timer-ring"><svg viewBox="0 0 230 230" aria-hidden="true"><circle cx="115" cy="115" r="105" stroke="#352047" stroke-width="8" fill="none"/><circle id="progress" cx="115" cy="115" r="105" stroke="${p.accent}" stroke-width="8" stroke-linecap="round" fill="none" stroke-dasharray="659.735" stroke-dashoffset="0"/></svg><div><div class="time" id="time"></div><div class="timer-status" id="timerStatus">${t(running?'inProgress':'paused')}</div></div></div><div class="session-actions"><button class="secondary" id="pauseBtn" onclick="toggleTimer()">${t(running?'pause':'resume')}</button><button class="primary" onclick="finishSession()">${t('finish')}</button></div><button class="stop" onclick="requestExit('home')">${t('stop')}</button><p class="tiny">${t('timerNote')}</p></div>`;drawTimer()}
function drawTimer(){if(!$('time'))return;$('time').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');$('progress').setAttribute('stroke-dashoffset',659.735*(1-left/initial))}
function tick(){if(!active)return;if(running)left=Math.max(0,Math.ceil((deadline-Date.now())/1000));drawTimer();if(left===0&&running)finishSession()}
function toggleTimer(){if(!active)return;if(running){tick();if(!active)return;running=false}else{deadline=Date.now()+left*1000;running=true}$('pauseBtn').textContent=t(running?'pause':'resume');$('timerStatus').textContent=t(running?'inProgress':'paused')}
function stopTimer(){active=false;running=false;clearInterval(interval);interval=null;closeExit()}
function finishSession(){if(!active)return;if(running)left=Math.max(0,Math.ceil((deadline-Date.now())/1000));stopTimer();const elapsed=initial-left;lastResult={program:chosen,seconds:elapsed,date:new Date().toISOString()};logs.unshift(lastResult);safeSet('zen-demo-v1',JSON.stringify(logs));renderComplete();show('complete','replace')}
function renderComplete(){if(!lastResult)return;const p=program(lastResult.program);$('complete').innerHTML=`<div class="session"><div class="done-mark">✓</div><div class="eyebrow">${t('done')}</div><h1>${t('doneTitle')}</h1><p>${p.name} · ${formatTime(lastResult.seconds)}</p><div class="panel"><h2>${t('rest')}</h2><p>${t('logged')}</p></div><button class="primary" onclick="navigate('home')">${t('home')}</button><button class="stop" onclick="navigate('history')">${t('historyTitle')}</button></div>`}
function requestExit(target){exitTarget=target;if(!active){show(target);return}if(!$('exitDialog').open)$('exitDialog').showModal()}
function closeExit(){if($('exitDialog').open)$('exitDialog').close()}
function confirmExit(){if(!active){closeExit();return}stopTimer();show(exitTarget,'replace')}
function formatTime(s){return Math.floor(s/60)+' min'+(s%60?' '+s%60+' s':'')}
function renderLogs(){$('count').textContent=logs.length;$('minutes').textContent=Math.floor(logs.reduce((s,l)=>s+l.seconds,0)/60);$('logs').replaceChildren();if(!logs.length){$('logs').textContent=t('empty');return}logs.forEach(l=>{const row=document.createElement('div');row.className='logrow';const a=document.createElement('div'),b=document.createElement('div'),small=document.createElement('small');a.textContent=l.program>=0?program(l.program).name:(l.name||'Zen');small.textContent=new Date(l.date).toLocaleDateString(locale());b.append(document.createTextNode(formatTime(l.seconds)+' · '),small);row.append(a,b);$('logs').append(row)})}
window.addEventListener('popstate',()=>{if(active){try{history.pushState({view:'session'},'')}catch{}requestExit('home');return}show('home','replace')});
renderHome();show('home','replace');
</script></body></html>
